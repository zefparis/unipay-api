services:
  - type: web
    name: unipay-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: HMAC_SECRET
        generateValue: true
      - key: OPERATOR_WEBHOOK_SECRET
        generateValue: true
      - key: UNIPESA_MERCHANT_CALLBACK_URL
        sync: false
      - key: BRIDGE_API_URL
        sync: false
      - key: BRIDGE_API_KEY
        sync: false
      - key: ANTHROPIC_ADMIN_API_KEY
        sync: false
      - key: VERCEL_API_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: DEV_EXPENSES_PUBLIC_ORIGIN
        value: https://dev-expenses.netlify.app

  # ── Cron: 1st of month 06:00 UTC — auto-pull Anthropic + Vercel costs ──
  # Auth: x-admin-secret: CRON_SERVICE_SECRET (separate from ADMIN_SECRET
  # so each can be rotated independently). RENDER_EXTERNAL_URL is NOT
  # available on cron services — API_URL is declared explicitly below.
  - type: cron
    name: dev-expenses-monthly-pull
    env: node
    region: frankfurt
    plan: starter
    schedule: "0 6 1 * *"
    buildCommand: ""
    command: node scripts/cron-pull-dev-expenses.js
    envVars:
      - key: API_URL
        value: https://unipay-api.onrender.com
      - key: CRON_SERVICE_SECRET
        sync: false

  # ── Cron: daily 08:00 UTC — check invoices due within 7 days ──
  - type: cron
    name: dev-expenses-due-check
    env: node
    region: frankfurt
    plan: starter
    schedule: "0 8 * * *"
    buildCommand: ""
    command: node scripts/cron-due-date-check.js
    envVars:
      - key: API_URL
        value: https://unipay-api.onrender.com
      - key: CRON_SERVICE_SECRET
        sync: false

  # ── Cron: daily 03:00 UTC — merchant inactivity sweep ──
  # Scans merchants with kyc_status='pending' AND volume=0, sends
  # reminder emails (J3/J7/J12), marks to_relaunch (J7), inactive (J14),
  # soft-deletes (J104). See src/lib/merchant-inactivity-sweep.ts.
  - type: cron
    name: merchant-inactivity-sweep
    env: node
    region: frankfurt
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: ""
    command: node scripts/cron-merchant-inactivity-sweep.js
    envVars:
      - key: API_URL
        value: https://unipay-api.onrender.com
      - key: CRON_SERVICE_SECRET
        sync: false
